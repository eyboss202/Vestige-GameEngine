<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>VESTIGE — Vestige Engine demo</title>
  <meta name="description" content="VESTIGE, the sample game for Vestige Engine: a dependency-free top-down pixel-art engine in plain JavaScript." />
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="styles/main.css" />
</head>
<body>
  <!-- The visible canvas. Everything is rendered into an off-screen buffer at
       384x216 and upscaled onto this one, so the pixel grid never breaks. -->
  <canvas id="game" aria-label="Game screen" role="img"></canvas>

  <!-- Shown until the first key press, because browsers block audio until the
       page has had a real user gesture. -->
  <div id="gesture-hint" class="hint">
    <span class="hint__key">PRESS ANY KEY</span>
    <span class="hint__sub">sound starts on first input</span>
  </div>

  <noscript class="hint">This game needs JavaScript enabled.</noscript>

  <script type="module" src="game/main.js"></script>
  <script>
    // Purely cosmetic: fade the hint out once the player has interacted.
    const hint = document.getElementById('gesture-hint');
    const dismiss = () => { hint.classList.add('hint--gone'); };
    window.addEventListener('keydown', dismiss, { once: true });
    window.addEventListener('pointerdown', dismiss, { once: true });
  </script>
</body>
</html>
