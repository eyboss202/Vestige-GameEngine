name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Import check + tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Static import check (engine must never import game code)
        run: node tools/check-imports.mjs
      - name: Unit + content tests
        run: node --test tests/*.test.js
